<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Antoraa | Authentication</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="stylesheet" href="../css/animation.css">
    <link rel="stylesheet" href="../css/loader.css">
</head>

<body class="bg-[#0D1117] text-green-400 font-mono h-screen flex items-center justify-center">

    <div class="w-[90%] max-w-6xl h-[85vh] rounded-xl overflow-hidden border border-gray-700 shadow-2xl shadow-green-500/10">

        <!-- Header -->

        <div class="h-12 bg-[#161B22] border-b border-gray-700 flex items-center px-5">

            <div class="flex gap-2">

                <div class="w-3 h-3 rounded-full bg-red-500"></div>
                <div class="w-3 h-3 rounded-full bg-yellow-400"></div>
                <div class="w-3 h-3 rounded-full bg-green-500"></div>

            </div>

            <h1 class="ml-6 text-white tracking-widest text-sm uppercase">
                root@kali:~# projectantoraa.exe
            </h1>

        </div>

        <!-- Terminal -->

        <div
            id="terminal"
            class="h-[calc(100%-48px)] p-8 overflow-y-auto bg-[#0D1117]"
        >

            <div id="output" class="space-y-2 text-lg"></div>

            <div class="flex items-center mt-6">

                <span class="mr-3 text-green-400">></span>

                <input
                    id="terminalInput"
                    type="text"
                    autocomplete="off"
                    autofocus
                    class="bg-transparent outline-none border-none w-full text-green-400 caret-green-400"
                >

            </div>

        </div>

    </div>

    <!-- Loader -->
    <div
        id="pageLoader"
        class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/50 backdrop-blur-lg"
    >

        <div class="flex flex-col items-center">

            <!-- Spinner -->
            <div
                class="w-16 h-16 rounded-full border-4 border-gray-700 border-t-green-400 animate-spin">
            </div>

            <p
                id="loaderText"
                class="mt-6 font-mono text-green-400 tracking-widest text-lg">
                Loading...
            </p>

        </div>

    </div>

<script src="../js/terminal.js"></script>
<script src="../js/loader.js"></script>

</body>
</html>
