<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Antoraa</title>

    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="../css/animation.css">
    <link rel="stylesheet" href="../css/loader.css">
    <link rel="stylesheet" href="../css/letter.css">
    <link rel="stylesheet" href="../css/stickynote.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Roboto+Slab:wght@100..900&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet">
</head>

<body class="bg-[#FFF9F6] overflow-x-hidden relative min-h-screen">

    <div class="blob blob1"></div>
    <div class="blob blob2"></div>

    <main class="bg-[#FFF8F5] min-h-screen flex items-center justify-center overflow-hidden">
        <div class="envelope-container">

        <div class="envelope">

            <div class="flap"></div>

            <div class="letter">
                <h2>For You ❤️</h2>
            </div>

            <button id="openLetter">
                ❤
            </button>

        </div>

    </div>

    </main>

    <div class="sticky-note">
    <p>Press on</p>
    <span>❤</span>
    </div>

    <div id="pageLoader" class="fixed inset-0 z-[9999] flex items-center justify-center bg-black/50 backdrop-blur-lg">
        <div class="flex flex-col items-center">
            <div class="w-16 h-16 rounded-full border-4 border-gray-700 border-t-green-400 animate-spin"></div>
            <p id="loaderText" class="mt-6 font-mono text-green-400 tracking-widest text-lg">Loading...</p>
        </div>
    </div>

    <script src="../js/welcome.js"></script>
    <script src="../js/button-functionality.js"></script>
    <script src="../js/loader.js"></script>
    <script src="../js/letter.js"></script>
</body>
</html>
